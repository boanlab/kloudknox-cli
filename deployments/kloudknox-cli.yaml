---
apiVersion: v1
kind: Namespace
metadata:
  name: kloudknox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    boanlab.com/app: kloudknox-cli
  name: kloudknox-cli
  namespace: kloudknox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    boanlab.com/app: kloudknox-cli
  name: kloudknox-cli
rules:
# Policy CRUD — apply, delete, get, describe.
- apiGroups: ["security.boanlab.com"]
  resources: ["kloudknoxpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# status / describe node / sysdump read-only access.
- apiGroups: [""]
  resources: ["pods", "nodes", "events", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    boanlab.com/app: kloudknox-cli
  name: kloudknox-cli
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudknox-cli
subjects:
- kind: ServiceAccount
  name: kloudknox-cli
  namespace: kloudknox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudknox-cli
  namespace: kloudknox
  labels:
    boanlab.com/app: kloudknox-cli
spec:
  replicas: 1
  selector:
    matchLabels:
      boanlab.com/app: kloudknox-cli
  template:
    metadata:
      labels:
        boanlab.com/app: kloudknox-cli
    spec:
      serviceAccountName: kloudknox-cli
      terminationGracePeriodSeconds: 5
      containers:
      - name: kkctl
        image: boanlab/kloudknox-cli:latest
        imagePullPolicy: Always
        # Override the kkctl entrypoint so the pod stays up for `kubectl exec`.
        command: ["sleep", "infinity"]
        workingDir: /work
        volumeMounts:
        - name: work
          mountPath: /work
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 32Mi
      volumes:
      - name: work
        emptyDir: {}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
